name: Setup Godot
description: >-
  Instala o Godot oficial (binario Linux, versao fixada em GODOT_VERSION) conferido por SHA-512 literal, com cache, e exporta GODOT_PATH.
  Com templates=true instala tambem o template web (nothreads) usado pelo preset Web.

inputs:
  templates:
    description: 'true para instalar o export template web da versao fixada'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Versao e somas vem do SHA512-SUMS.txt oficial do release da versao
    # (https://github.com/godotengine/godot/releases, tag <versao>-stable).
    # Para trocar de versao: atualizar GODOT_VERSION e as duas somas (conferidas no SHA512-SUMS.txt do release);
    # nomes, URL, diretorios e chaves de cache derivam delas. O cache do binario guarda o .zip e a soma e conferida em todo run.
    # Cache de PR e por ref: o primeiro run de cada PR baixa; depois do CI verde na main, o cache dela serve os PRs.
    - name: Definir versao e somas
      id: vars
      shell: bash
      run: |
        set -euo pipefail
        GODOT_VERSION=4.7.2
        GODOT_SHA512=9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
        TEMPLATES_SHA512=ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
        GODOT_ASSET="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
        GODOT_BIN="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
        TEMPLATES_ASSET="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
        GODOT_BASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
        GODOT_DL_DIR="$HOME/godot-dl"
        GODOT_DIR="$HOME/godot-bin"
        TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
        {
          echo "GODOT_VERSION=$GODOT_VERSION"
          echo "GODOT_SHA512=$GODOT_SHA512"
          echo "TEMPLATES_SHA512=$TEMPLATES_SHA512"
          echo "GODOT_ASSET=$GODOT_ASSET"
          echo "GODOT_BIN=$GODOT_BIN"
          echo "TEMPLATES_ASSET=$TEMPLATES_ASSET"
          echo "GODOT_BASE_URL=$GODOT_BASE_URL"
          echo "GODOT_DL_DIR=$GODOT_DL_DIR"
          echo "GODOT_DIR=$GODOT_DIR"
          echo "TEMPLATES_DIR=$TEMPLATES_DIR"
        } >> "$GITHUB_ENV"
        {
          echo "bin_dl_dir=$GODOT_DL_DIR"
          echo "bin_key=godot-${GODOT_VERSION}-${RUNNER_OS}-${RUNNER_ARCH}-zip-${GODOT_SHA512}"
          echo "tpl_dir=$TEMPLATES_DIR"
          echo "tpl_key=godot-templates-${GODOT_VERSION}-${RUNNER_OS}-${RUNNER_ARCH}-web-nothreads-${TEMPLATES_SHA512}"
        } >> "$GITHUB_OUTPUT"

    - name: Cache do binario (.zip)
      id: cache-bin
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.vars.outputs.bin_dl_dir }}
        key: ${{ steps.vars.outputs.bin_key }}

    - name: Baixar o binario
      if: steps.cache-bin.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$GODOT_DL_DIR"
        curl -fsSL --retry 3 -o "$GODOT_DL_DIR/$GODOT_ASSET" "$GODOT_BASE_URL/$GODOT_ASSET"

    # Em todo run (hit e miss): a soma do zip e conferida antes de extrair.
    - name: Conferir e extrair o binario
      shell: bash
      run: |
        set -euo pipefail
        zip="$GODOT_DL_DIR/$GODOT_ASSET"
        echo "$GODOT_SHA512  $zip" | sha512sum -c -
        mkdir -p "$GODOT_DIR"
        unzip -o -j "$zip" -d "$GODOT_DIR"
        chmod +x "$GODOT_DIR/$GODOT_BIN"

    - name: Exportar GODOT_PATH
      shell: bash
      run: |
        set -euo pipefail
        test -x "$GODOT_DIR/$GODOT_BIN"
        echo "GODOT_PATH=$GODOT_DIR/$GODOT_BIN" >> "$GITHUB_ENV"

    - name: Cache dos export templates
      id: cache-tpl
      if: inputs.templates == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.vars.outputs.tpl_dir }}
        key: ${{ steps.vars.outputs.tpl_key }}

    # A chave inclui TEMPLATES_SHA512: trocar a soma forca o miss e, com ele, a conferencia abaixo.
    - name: Baixar, conferir e podar os export templates
      if: inputs.templates == 'true' && steps.cache-tpl.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        tpz="$RUNNER_TEMP/$TEMPLATES_ASSET"
        curl -fsSL --retry 3 -o "$tpz" "$GODOT_BASE_URL/$TEMPLATES_ASSET"
        echo "$TEMPLATES_SHA512  $tpz" | sha512sum -c -
        mkdir -p "$TEMPLATES_DIR"
        # O preset Web usa so o template nothreads (thread_support=false, extensions_support=false).
        unzip -o -j "$tpz" templates/version.txt templates/web_nothreads_release.zip -d "$TEMPLATES_DIR"
        rm -f "$tpz"
        ls -l "$TEMPLATES_DIR"
